<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDR Real-Time Spectrum Analyzer & Modulation Classifier</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-green: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: #fff; }
    .badge {
      background: #238636;
      color: white;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .panel h2 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
    }
    canvas {
      display: block;
      width: 100%;
      background: #000;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.85rem;
    }
    .pred-box {
      background: #04101e;
      border: 1px solid #1f6feb;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      margin-top: 10px;
    }
    .pred-val {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>📡 SDR Real-Time Spectrum Analyzer & Modulation Classifier</h1>
    <span id="conn-status" class="badge">Connecting...</span>
  </header>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>Power Spectral Density (PSD)</h2>
        <canvas id="fftCanvas" height="140"></canvas>
        <h2>Real-Time Waterfall Spectrogram</h2>
        <canvas id="waterfallCanvas" height="300"></canvas>
      </div>
    </div>

    <div class="panel">
      <h2>RF & Receiver Telemetry</h2>
      <div class="status-item"><span>Center Frequency</span><strong id="val-freq">100.0 MHz</strong></div>
      <div class="status-item"><span>Sample Rate</span><strong id="val-rate">2.4 MSPS</strong></div>
      <div class="status-item"><span>FFT Resolution</span><span>512 Bins</span></div>
      <div class="status-item"><span>Frame Rate</span><span id="val-fps">0 FPS</span></div>

      <div class="pred-box">
        <div style="font-size: 0.75rem; text-transform: uppercase; color: #8b949e;">Live Modulation Classification</div>
        <div class="pred-val" id="val-modulation">--</div>
        <div style="font-size: 0.8rem; color: #8b949e;" id="val-confidence">Confidence: --%</div>
      </div>
    </div>
  </div>

  <script>
    const fftCanvas = document.getElementById('fftCanvas');
    const fftCtx = fftCanvas.getContext('2d');
    const waterfallCanvas = document.getElementById('waterfallCanvas');
    const waterfallCtx = waterfallCanvas.getContext('2d');

    const statusBadge = document.getElementById('conn-status');
    const valFreq = document.getElementById('val-freq');
    const valRate = document.getElementById('val-rate');
    const valMod = document.getElementById('val-modulation');
    const valConf = document.getElementById('val-confidence');
    const valFps = document.getElementById('val-fps');

    let frameCount = 0;
    let lastFpsTime = performance.now();

    function connect() {
      const wsUrl = `ws://${window.location.hostname || 'localhost'}:8000/ws/stream`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusBadge.textContent = 'CONNECTED';
        statusBadge.style.background = '#238636';
      };

      ws.onclose = () => {
        statusBadge.textContent = 'DISCONNECTED';
        statusBadge.style.background = '#da3633';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        renderSpectrum(data.waterfall);
        renderWaterfallRow(data.waterfall);

        valFreq.textContent = (data.center_freq / 1e6).toFixed(2) + ' MHz';
        valRate.textContent = (data.sample_rate / 1e6).toFixed(1) + ' MSPS';
        if (data.prediction) {
          valMod.textContent = data.prediction.modulation;
          valConf.textContent = 'Confidence: ' + (data.prediction.confidence * 100).toFixed(1) + '%';
        }

        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          valFps.textContent = frameCount + ' FPS';
          frameCount = 0;
          lastFpsTime = now;
        }
      };
    }

    function renderSpectrum(bins) {
      fftCtx.clearRect(0, 0, fftCanvas.width, fftCanvas.height);
      fftCtx.strokeStyle = '#58a6ff';
      fftCtx.lineWidth = 1.5;
      fftCtx.beginPath();
      const step = fftCanvas.width / bins.length;
      for (let i = 0; i < bins.length; i++) {
        const y = fftCanvas.height - (bins[i] / 255.0) * fftCanvas.height;
        if (i === 0) fftCtx.moveTo(0, y);
        else fftCtx.lineTo(i * step, y);
      }
      fftCtx.stroke();
    }

    function renderWaterfallRow(bins) {
      // Shift existing image down by 1 pixel
      waterfallCtx.drawImage(waterfallCanvas, 0, 0, waterfallCanvas.width, waterfallCanvas.height - 1, 0, 1, waterfallCanvas.width, waterfallCanvas.height - 1);
      const rowImg = waterfallCtx.createImageData(bins.length, 1);
      for (let i = 0; i < bins.length; i++) {
        const val = bins[i];
        // Jet / Heat colormap
        const idx = i * 4;
        rowImg.data[idx] = Math.min(255, val * 2);        // R
        rowImg.data[idx + 1] = Math.min(255, val * 1.5);  // G
        rowImg.data[idx + 2] = 255 - val;                // B
        rowImg.data[idx + 3] = 255;                      // Alpha
      }
      waterfallCtx.putImageData(rowImg, 0, 0);
    }

    connect();
  </script>
</body>
</html>
